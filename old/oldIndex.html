<html>
<body>

<!-- <h1>My first SVG</h1> -->

<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <!--This creates 2 gradients one that will be used for the rectangle and another for the circle-->
    <defs>
        <linearGradient id="myRamp" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="yellow" />
            <stop offset="50%" stop-color="white" />
            <stop offset="100%" stop-color="yellow" />
        </linearGradient>
        <linearGradient id="circleRamp" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="white" />
            <stop offset="50%" stop-color="yellow" />
            <stop offset="100%" stop-color="white" />
        </linearGradient>
    </defs>

    <!--This creates a rectandle as the background of the scree filling everything-->
    <rect width="100%" height="100%" fill="url(#myRamp)" rx="2vw" ry="2vw" />

    <!-- This creates 2 lines i a sort of flag pattern -->
    <line x1="0" y1="0%" x2="100%" y2="100%" stroke="black" stroke-width="1vw" />
    <line x1="0" y1="0%" x2="100%" y2="100%" stroke="white" stroke-width="0.5vw" />

    <line x1="100%" y1="0%" x2="0%" y2="100%" stroke="black" stroke-width="1vw" />
    <line x1="100%" y1="0%" x2="0%" y2="100%" stroke="white" stroke-width="0.5vw" />

    <!-- This creates a circle in the middle of the screen on top of the lines-->
    <circle 
        cx="50%" 
        cy="50%" 
        r="10%" 
        fill="yellow" 
        style="fill :url(#circleRamp);
        stroke:rgb(0, 0, 0);
        stroke-width:0.5vw;
        stroke-opacity:1"
    />

    <polygon points="0,10 150,190 50,190" style="fill:rgb(255, 255, 255);stroke:rgb(0, 0, 0);stroke-width:3" />

    <!-- This will make the text in the middle of the screen appear -->
    <text x="50%" y="55%" font-size="10vh" text-anchor="middle" fill="white">SVG</text>
</svg>

</body>
</html>
