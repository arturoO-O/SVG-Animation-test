<html>
    <head>
        <link rel="icon" href="/images/faces/normal.png" type="image/png">   
    </head>
    <body>
        <audio id="bounceAudio1" src="sounds/bounce.mp3"></audio>
        <audio id="bounceAudio2" src="sounds/bounce2.mp3"></audio>
        <audio id="bounceAudio3" src="sounds/bounce3.mp3"></audio>

        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">

        <defs>
            <!-- Main circle gradient -->
            <radialGradient id="grad1" cx="70%" cy="35%">
                <stop offset="0%" stop-color="white" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
            </radialGradient>
            <!-- Fade around the outside -->
            <radialGradient id="grad2" cx="50%" cy="50%">Z
                 <stop offset="80%" stop-color="red" stop-opacity="1" />
                 <stop offset="100%" stop-color="black" stop-opacity="1" />
            </radialGradient>
            <radialGradient id="grad3" cx="50%" cy="50%">Z
                 <stop offset="90%" stop-color="black" stop-opacity="0" />
                 <stop offset="100%" stop-color="black" stop-opacity="1" />
            </radialGradient>
        </defs>

        <rect width="100%" height="100%" fill="white" />

        <ellipse
            id="playerBase"
            rx="5vw"
            ry="5vw"
            cx="50%"
            cy="50%"
            fill="url(#grad2)"
        />

        <ellipse
            id="playerHighlight"
            rx="5vw"
            ry="5vw"
            cx="50%"
            cy="50%"
            fill="url(#grad1)"
        />

        <ellipse
            id="playerOutline"
            rx="5vw"
            ry="5vw"
            cx="50%"
            cy="50%"
            fill="url(#grad3)"
        />

        <image id="playerFace" href="/images/faces/normal.png" x="50%" y="50%" width="5vw" height="5vw" />
        </svg>
    </body>
    <style>
        body {
            background-color: rgb(0, 0, 0);
        }
    </style>
    <script type="module" src="./js/main.js"></script>
</html>
